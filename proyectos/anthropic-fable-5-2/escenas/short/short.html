<link rel="stylesheet" href="../../../../motor/estilo/estilo.css">
<style>
  .oculto { display: none !important; }
  #base { position: absolute; inset: 0; background: #07090f; }
  .profundidad { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #lejos { filter: blur(2px); }
  #delante { filter: blur(2.5px); }
  .titular.grande { font-size: 16px; line-height: 24px; }
  .titular.grande.menor { font-size: 8px; line-height: 12px; color: var(--texto-suave); }
  .cifra-ui { font: 600 12px/10px "Mono"; }
  .etiqueta.fondo, .etiqueta.fondo-suave { background: #0c1016; padding: 2px 3px 1px; }
  .etiqueta.fondo-suave { color: var(--texto-suave); }
  .etiqueta.verde { color: var(--verde); }
  .etiqueta.naranja { color: var(--naranja); }
  #fuente { left: 16px; top: 80px; } /* pestaña de la fuente del dato: bajo el rótulo, sobre el mundo */
  #transicion { position: absolute; inset: 0; overflow: hidden; }
</style>
<body class="short">
  <div id="base"></div>
  <div id="transicion">
    <div class="profundidad" id="p-lejos"><svg class="arte" id="lejos"></svg></div>
    <div class="profundidad" id="p-medio">
      <svg class="arte" id="medio"></svg>
      <svg class="arte bloom" id="brillo"></svg>
      <svg class="arte" id="frente"></svg>
    </div>
    <div class="profundidad" id="p-delante"><svg class="arte" id="delante"></svg></div>
    <svg class="arte" id="gato12"></svg>
    <div class="capa vineta"></div>
  </div>
  <div id="textos"></div>
  <div class="fuente-dato con-fondo oculto" id="fuente"></div>
  <div class="dialogo con-retrato oculto" id="dialogo"><svg class="retrato" id="retrato"></svg><span class="nombre">Mista</span><span id="frase"></span></div>

  <script src="../../../../motor/estilo/pixel.js"></script>
  <script src="../../../../motor/estilo/v3/gato.js"></script>
  <script src="../../../../motor/estilo/camara.js"></script>
  <script src="../../../../motor/estilo/v5/dibujo.js"></script>
  <script src="../../../../motor/estilo/v5/escena.js"></script>
  <script src="timing.js"></script>
  <script src="short.js"></script>
</body>

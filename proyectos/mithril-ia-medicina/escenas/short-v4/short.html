<link rel="stylesheet" href="../../../../motor/estilo/estilo.css">
<style>
  .oculto { display: none !important; }
  /* Cámara: el mundo (escenario, objetos, MISTA y textos de los objetos) se escala y desplaza desde seek(t).
     Los rótulos y la caja de diálogo son interfaz y no se mueven con la cámara. */
  #mundo { position: absolute; left: 0; top: 0; width: 270px; height: 480px; transform-origin: 0 0; }
  #textos-ui { position: absolute; inset: 0; }
  #base { position: absolute; inset: 0; background: #0c1016; }
</style>
<body class="short">
  <div id="base"></div>
  <div id="mundo">
    <svg class="arte desenfoque" id="fondo"></svg>
    <svg class="arte" id="medio"></svg>
    <svg class="arte bloom" id="brillo"></svg>
    <svg class="arte" id="frente"></svg>
    <div id="textos"></div>
  </div>
  <div class="capa vineta"></div>
  <div id="textos-ui"></div>
  <div class="dialogo con-retrato oculto" id="dialogo"><svg class="retrato" id="retrato"></svg><span class="nombre">Mista</span><span id="frase"></span></div>

  <script src="../../../../motor/estilo/pixel.js"></script>

<!doctype html>
<meta charset="utf-8">
<title>Calibración v5 · clip (diorama a 4 px, cámara que viaja, MISTA en el tema)</title>
<!-- Render: node motor/render.mjs --escena <este html> --ancho 270 --alto 480 --duracion 19.9 --consulta "formato=short"
            --incluir motor/estilo,proyectos/mithril-ia-medicina/escenas/short-v6 --salida <mp4>
     Largo: --ancho 480 --alto 270 --consulta "formato=largo". Tramo real de Mithril (fr01-fr03, 0-19,9 s) con su voz.
     Arte a 4 px de salida por píxel (1 unidad = 1 px CSS); el mundo mide 2 pantallas de ancho: oficina y laboratorio. -->
<link rel="stylesheet" href="../../estilo/estilo.css">
<style>
  .oculto { display: none !important; }
  #base { position: absolute; inset: 0; background: #07090f; }
  .profundidad { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #lejos { filter: blur(2px); }
  #delante { filter: blur(2.5px); }
  body.largo .dialogo { left: 16px; width: 448px; top: 200px; height: 58px; }
  .titular.grande { font-size: 16px; line-height: 24px; }
  .cifra-ui { font: 600 12px/10px "Mono"; color: var(--verde); }
  .etiqueta.fondo { background: #0c1016; padding: 2px 3px 1px; } /* etiquetas sobre el diorama: se leen sobre cualquier fondo */
  #transicion { position: absolute; inset: 0; overflow: hidden; }
</style>
<body class="short">
  <div id="base"></div>
  <div id="transicion">
    <div class="profundidad" id="p-lejos"><svg class="arte" id="lejos"></svg></div>
    <div class="profundidad" id="p-medio">
      <svg class="arte" id="medio"></svg>
      <svg class="arte bloom" id="brillo"></svg>
      <svg class="arte" id="frente"></svg>
    </div>
    <div class="profundidad" id="p-delante"><svg class="arte" id="delante"></svg></div>
    <svg class="arte" id="gato12"></svg>
    <div class="capa vineta"></div>
  </div>
  <div id="textos"></div>
  <div class="dialogo con-retrato oculto" id="dialogo"><svg class="retrato" id="retrato"></svg><span class="nombre">Mista</span><span id="frase"></span></div>

  <script src="../../estilo/pixel.js"></script>
  <script src="../../estilo/v3/gato.js"></script>
  <script src="../../estilo/camara.js"></script>
  <script src="../../estilo/v5/dibujo.js"></script>
  <script src="../../estilo/v5/escena.js"></script>
  <script src="../../../proyectos/mithril-ia-medicina/escenas/short-v6/timing.js"></script>
  <script src="clip.js"></script>
</body>

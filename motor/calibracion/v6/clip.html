<title>Calibración v6 · clip (casi sin texto, fuente en la caja, cámara tras la frase)</title>
<!-- El clip v5 de Mithril (fr01-fr03) con las reglas v6 (ADR 0010), para comparar en 16:9 con motor/calibracion/v5/clip.html.
     Timing:  node motor/voz/revisar-alineacion.mjs proyectos/mithril-ia-medicina/timing.short.json <voz.wav> --corregir motor/calibracion/v6/timing.short.json
              node motor/timing-a-js.mjs motor/calibracion/v6/timing.short.json motor/calibracion/v6/timing.js
                --guion proyectos/mithril-ia-medicina/guion.md --seccion Short --fuentes proyectos/mithril-ia-medicina/fuentes.json
     Lint:    node motor/revisar.mjs motor/calibracion/v6/clip.html 480 270 21.6 0.05 . --consulta "formato=largo" --estricto
     Render:  node motor/render.mjs --escena motor/calibracion/v6/clip.html --ancho 480 --alto 270 --duracion 21.6 --consulta "formato=largo"
                --incluir motor/estilo,motor/estilo/v5,motor/estilo/v6 --salida <mp4>      (short: --ancho 270 --alto 480 --consulta "formato=short")
     La voz entra 1,2 s después: en la mezcla, --voz-desfase 1.2. -->
